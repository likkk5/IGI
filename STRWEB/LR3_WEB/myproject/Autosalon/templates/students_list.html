{% extends 'baseview.html' %}
{% load static %}
{% block content %}
<head>
    <link rel="stylesheet" href="{% static 'css/students_list.css' %}">
</head>
<body>
    <div class="centered-container">
        <form id="studentForm">
            <input type="text" name="firstName" placeholder="Имя" required>
            <input type="text" name="lastName" placeholder="Фамилия" required>
            <input type="number" name="physics" placeholder="Физика" required min="2" max="5">
            <input type="number" name="math" placeholder="Математика" required min="2" max="5">
            <input type="number" name="literature" placeholder="Литература" required min="2" max="5">
            <button type="button" onclick="addStudent()">Добавить ученика</button>
        </form>
        
        <button onclick="usePrototypeInheritance()">Использовать прототипное наследование</button>
        <button onclick="useClassInheritance()">Использовать классы и extends</button>

        <h3>Все студенты (Прототипное наследование):</h3>
        <div id="students-list-all-prototype"></div>
        <h3>Студенты с проходными оценками (Прототипное наследование):</h3>
        <div id="students-list-prototype"></div>
        
        <h3>Все студенты (class/extends):</h3>
        <div id="students-list-all-class"></div>
        <h3>Студенты с проходными оценками (class/extends):</h3>
        <div id="students-list-class"></div>
    </div>
</body>
<script src="{% static 'js/students_list.js' %}"></script>
{% endblock %}
