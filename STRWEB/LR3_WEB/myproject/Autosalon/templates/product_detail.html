{% extends 'baseview.html' %}
{% load static %}
{% block content %}
<head>
    <link rel="stylesheet" href="{% static 'css/product_detail.css' %}">
</head>
<body>
<article class="product-detail">
    <header class="product-header">
        <h1>{{ product.name }}</h1>
    </header>
    <figure class="product-figure">
        <img src="{{ product.photo.url }}" alt="{{ product.name }}" class="product-image" />
        <figcaption class="product-description">{{ product.description }}</figcaption>
    </figure>
    <section class="product-info">
        <p><strong>Цена:</strong> <span>{{ product.price }} руб.</span></p>
        <form action="{% url 'add_to_cart' product.id %}" method="post">
            {% csrf_token %}
            <button type="submit" class="add-to-cart-btn">Добавить в корзину</button>
        </form>
    </section>
</article>
</body>
{% endblock %}
